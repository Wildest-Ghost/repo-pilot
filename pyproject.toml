[project]
name = "repo-pilot"
version = "0.1.0"
description = "A repository-level coding agent platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.400",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests","apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests","apps"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]
